<style>
/* =====================================================================
   1. THEME + BASE
   ===================================================================== */

/* Colors and fonts used everywhere. --ac = red accent, --ok = green accent */
:root {
  --bg:   #0a0a0a;
  --fg:   #e8e8e8;
  --mut:  #8a8a8a;                     /* muted grey text */
  --card: rgba(20, 20, 20, .88);       /* card / box background */
  --bd:   #2c2c2c;                     /* card / box border */
  --ac:   #cf0000;
  --ok:   #34d399;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  /* keep content clear of phone notches / system bars */
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

html {
  scroll-padding-top: env(safe-area-inset-top, 0px);
  scroll-behavior: auto;               /* page jumps are animated in JS instead */
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--mono);
  font-size: 14px;
  line-height: 1.6;
}

/* While the intro plays: pure black screen and no scrolling */
body.intro { overflow: hidden; background: #000; }

/* Snake canvas behind the whole site (fades in after the intro) */
#bg {
  position: fixed;
  inset: 0;
  z-index: -1;
  width: 100%;
  height: 100%;
  opacity: 0;
  transition: opacity 1.5s;
}
#bg.on { opacity: 1; }


/* =====================================================================
   2. TOP NAV + STATUS BAR
   ===================================================================== */
nav, #stat { transition: opacity 1s, transform .7s; }

body.ss nav    { transform: translateY(-150%); opacity: 0; pointer-events: none; }   /* hidden on the Screen Saver page */
body.intro nav,
body.intro #stat { opacity: 0; pointer-events: none; }                                /* hidden during the intro */

nav {
  position: fixed;
  top: env(safe-area-inset-top, 0px);
  left: 0;
  right: 0;
  z-index: 10;
  display: flex;
  justify-content: center;
  gap: clamp(16px, 4vw, 56px);
  padding: 16px 20px;
  background: linear-gradient(#0a0a0acc, transparent);
  overflow-x: auto;
  white-space: nowrap;
}
nav a        { color: var(--mut); cursor: pointer; text-decoration: none; }
nav a b      { color: var(--ac); margin-right: 8px; }
nav a.on     { color: #fff; font-weight: 700; }                                       /* current page */

/* Bottom-right live status box */
#stat {
  position: fixed;
  right: 16px;
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  z-index: 11;
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 8px;
  padding: 8px 16px;
  font-size: 12px;
  color: var(--mut);
}
#stat i { color: var(--ok); font-style: normal; }


/* =====================================================================
   3. PAGE LAYOUT + 00 WELCOME
   ===================================================================== */
section {
  min-height: 100vh;
  padding: 100px 4vw 60px;
  max-width: 95%;
  margin: 0 auto;
}

/* Welcome page: greeting on top, profile box under it, Enter button last */
#home  { display: flex; justify-content: center; align-items: flex-start; }
#stage { display: flex; flex-direction: column; align-items: center; gap: 24px; width: 100%; }

/* Profile box: text centered on the left, big photo on the right.
   Hidden until the greeting has moved up (.moved is added to #stage). */
#prof {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  width: min(100%, 1600px);
  flex: 1 1 auto;
  min-height: 340px;
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 20px 60px #000a;
  opacity: 0;
  transform: translateY(24px);
  transition: opacity 1s .4s, transform 1.2s cubic-bezier(.16, 1, .3, 1) .2s;
}
.moved #prof { opacity: 1; transform: none; }

/* Left side: all text, centered both ways */
.pi {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 36px 32px;
}
.nm {
  font-size: clamp(1.8rem, 4vw, 2.8rem);
  font-weight: 900;
  color: var(--ac);
  text-shadow: 2px 2px 0 #5a0000;
  line-height: 1.1;
  letter-spacing: .03em;
}
.chip {
  display: inline-block;
  border: 1px solid var(--ac);
  background: #cf000022;
  color: var(--ac);
  padding: 4px 14px;
  border-radius: 5px;
  margin: 0 5px 10px;
  font-size: .9em;
}

/* Right side: big rectangular photo. The <img> is absolutely positioned so a
   huge photo can never stretch the box. */
.pic {
  position: relative;
  min-height: 0;
  border-left: 2px solid var(--ac);
  background: #1a1a1a;
}
.ph {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* Phones: stack the box, photo on top */
@media (max-width: 800px) {
  #prof { grid-template-columns: 1fr; }
  .pic  { order: -1; min-height: 0; height: 280px; border-left: 0; border-bottom: 2px solid var(--ac); }
}

/* 06 Screen Saver: an empty page, only the snakes show */
#s6 { padding: 0; }


/* =====================================================================
   4. HANDWRITTEN GREETING (SVG letters + the writing dot)
   ===================================================================== */

/* Starts in the middle of the screen, then rises to the top center (.moved) */
#bub {
  position: relative;
  display: inline-block;
  flex: none;
  margin-top: max(0px, calc(50vh - 170px));
  transition: margin-top 1.2s cubic-bezier(.16, 1, .3, 1);
}

.gf { fill: #fff; fill-opacity: 0; transition: fill-opacity 1s; }          /* solid letter fill (fades in at the end) */

#hv.fill .gf { fill-opacity: 1; }
#hv.fill .gp { stroke-opacity: 0; }

/* The writing dot */
#pd {
  fill: #fff;
  opacity: 0;
  transition: opacity .5s;
  filter: drop-shadow(0 0 4px #fff);
  transform-box: fill-box;
  transform-origin: center;
}
#bub.dotin #pd                { opacity: 1; }
#bub.dotin:not(.write) #pd    { animation: pulse 1s ease-in-out infinite; }   /* pulses before writing starts */
#bub.done #pd                 { opacity: 0; }
@keyframes pulse { 50% { transform: scale(1.8); } }

.static #hv, .static .gp, .static .gf,
.static #bub, .static #prof, .static .anim-reveal { transition: none; }

/* "Press ENTER" button: fades up after the intro */
.anim-reveal { opacity: 0; transform: translateY(12px); transition: opacity .6s, transform .6s; pointer-events: none; }

.ok {
  border: 1px solid #010503;
  background: #0f2a1f;
  color: var(--ok);
  padding: 16px 24px;
  border-radius: 6px;
  cursor: pointer;
  text-align: center;
  box-shadow: 0 0 12px rgba(52, 211, 153, .15);

}
.ok:hover { background: #143829; box-shadow: 0 0 20px rgba(52, 211, 153, .35); }

   5. SHARED COMPONENTS (headings, cards, timeline, grids, buttons, forms)
   ===================================================================== */
h2 {
  font-family: inherit;

}
.ac  { color: var(--ac); }                                  /* red highlighted words inside headings */
.log { color: var(--mut); font-size: 13px; }                /* small grey text */
.cm  { color: var(--mut); font-style: italic; }             /* italic "comment" text */

/* Generic card */
.card {
  position: relative;                                       /* anchors the ✕ delete button */
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 10px;
  padding: 22px;
  text-align: center;
}
.card h3  { font-size: 1.05em; margin: 8px 0; }
.card .yr { color: var(--ac); }
.card .tg span {                                            /* small outlined tags */
  display: inline-block;
  border: 1px solid var(--c);
  color: var(--c);
  background: #ffffff08;
  border-radius: 4px;
  padding: 2px 8px;
  margin: 3px;
  font-size: .75em;
}

/* 01 History timeline: one column per milestone, each with a card + sub-cards */
.tl {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 28px;
}
.col { --c: var(--ac); display: flex; flex-direction: column; gap: 14px; }
.col:nth-child(4n+2) { --c: #38bdf8; }                      /* per-column accent color (repeats every 4) */
.col:nth-child(4n+3) { --c: #a78bfa; }
.col:nth-child(4n+4) { --c: var(--ok); }
.node {
  width: 20px;
  height: 20px;
  border: 2px solid var(--c);
  border-radius: 50%;
  margin: 0 auto 4px;
}
.sub {
  position: relative;                                       /* anchors the ✕ delete button */
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 6px;
  padding: 12px;
  text-align: center;
  font-size: .85em;
}
.sub b    { display: block; color: var(--c); margin-bottom: 4px; }
.sub span { color: var(--mut); font-size: .9em; }

/* Projects / Skills / Logs grid + left-aligned cards */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 24px;
}
.card.l      { text-align: left; --c: var(--ac); }
.card.l h3   { color: var(--ac); }
.card.l p    { color: var(--mut); margin: 8px 0; }

.btn, button {
  font: inherit;
  color: var(--ac);
  background: var(--card);
  border: 1px solid var(--ac);
  border-radius: 6px;
  padding: 10px 20px;
  cursor: pointer;
  text-decoration: none;
  display: inline-block;

.btn:hover, button:hover { background: #cf000022; }
.links { display: flex; flex-wrap: wrap; gap: 16px; margin: 24px 0; }

/* Builds the greeting as an SVG: one filled shape per letter (.gf), one outline
   per contour (.gp) for the dot to trace, plus the dot itself (#pd). */
function helloSVG(text) {
  let x = 0, paths = "";

  for (const ch of text) {
    const glyph = GV.g[ch];
    if (!glyph) continue;                                            /* skip unsupported characters */

    if (glyph.c.length) {
      paths += `<path class="gf" transform="translate(${x} 0)" d="${glyph.c.join("")}"/>`;
    }
    glyph.c.forEach(d => {
      paths += `<path class="gp" data-dx="${x}" transform="translate(${x} 0)" d="${d}"/>`;
    });
    x += glyph.w;                                                    /* move to the next letter position */
  }

  const width  = x + 120;
  const radius = width / 820 * 5;                                    /* dot radius scales with the text width */
  const viewBox = `-60 ${GV.top - 30} ${width} ${GV.bot - GV.top + 60}`;

  return `<svg id="hv" viewBox="${viewBox}" style="--sw:${(radius * .55).toFixed(1)}px">${paths}<circle id="pd" r="${radius.toFixed(1)}" cx="0" cy="0"/></svg>`;
}

/* Load saved edits from this browser (falls back to DEF) */
function load() {
  if (!EDIT_UNLOCKED) return JSON.parse(JSON.stringify(DEF));   /* visitors always get the hard-coded content */
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const saved = Object.assign({}, DEF, JSON.parse(raw));
      saved.m = Object.assign({}, DEF.m, saved.m);    /* make sure newly added contact fields exist */
      return saved;
    }
  } catch (e) {}
  return JSON.parse(JSON.stringify(DEF));
}

/* Save edits to this browser */

  if (!EDIT_UNLOCKED) return;

/* Escape text so it is safe to place inside HTML */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* Read a value by path, e.g. get(S, "tl.1.t") */
const get = (obj, path) => path.split(".").reduce((a, k) => a && a[k], obj);

/* Save a value into S by path, e.g. setP("tl.1.t", "New title").
   Top-level keys like "name" or "quote" have no parent path, so they are written straight onto S. */
function setP(path, value) {
  const keys = path.split("."), last = keys.pop();
  const parent = keys.length ? get(S, keys.join(".")) : S;
  parent[last] = value;
  save();
}

/* Only allow http(s)/mailto links (blocks javascript: links) */
const safe = u => { u = String(u || "").trim(); if (/^(https?:|mailto:)/i.test(u)) return u; return /^[\w-]+(\.[\w-]+)+(\/|$)/.test(u) ? "https://" + u : ""; };

/* =====================================================================
   5. INTRO ANIMATION
   black -> white dot -> dot traces the letters -> letters fill -> snakes start
   -> greeting rises to the top center, profile box + Enter button appear
   ===================================================================== */

/* Move the dot to distance `len` along outline `path` (adds the letter's x offset) */
function dotAt(path, len) {
  const dot = $("pd");
  if (!dot) return;
  const pt = path.getPointAtLength(len);
  dot.setAttribute("cx", pt.x + +path.dataset.dx);
  dot.setAttribute("cy", pt.y);
}

/* The dot traces each outline in order (like a pen), then the letters fill in */
function writeHello(done) {
  const WRITE_MS =3000;                                           /* total writing time in ms (raise = slower) */
  const svg = $("hv");
  const outlines = svg ? [...svg.querySelectorAll(".gp")] : [];
  if (!outlines.length) { done(); return; }

  const lengths   = outlines.map(p => p._len);
  const total     = lengths.reduce((a, c) => a + c, 0);
  const durations = lengths.map(l => l / total * WRITE_MS);        /* longer outlines take longer */

  let i = 0, startTime = 0, elapsedBefore = 0;

  (function frame(ts) {
    if (!startTime) startTime = ts;
    const elapsed = ts - startTime;

    /* finish every outline whose time is up */
    while (i < outlines.length && elapsed >= elapsedBefore + durations[i]) {
      outlines[i].style.strokeDashoffset = 0;
      elapsedBefore += durations[i];
      i++;
    }

    /* all traced: fill the letters and hand over */
    if (i >= outlines.length) { svg.classList.add("fill"); done(); return; }

    /* draw part of the current outline */
    const fraction = (elapsed - elapsedBefore) / durations[i];
    outlines[i].style.strokeDashoffset = lengths[i] * (1 - fraction);
    dotAt(outlines[i], lengths[i] * fraction);
    raf = requestAnimationFrame(frame);
  })(performance.now());
}

/* Click anywhere during the intro to skip it (left button only).
   Registered once here, not inside render(), so listeners don't pile up on every re-render. */
addEventListener("mousedown", e => {
  if (e.button !== 0 || introDone) return;
  introDone = true;      /* typeIt() now takes its "already seen" shortcut */
  typeIt();              /* cancels timers/animation and shows the final state instantly */
});

/* Runs the whole intro (or jumps straight to the finished state) */
function typeIt() {
  clearTimeout(tt);
  cancelAnimationFrame(raf);

  const bub = $("bub"), ok = $("s-ok"), stage = $("stage"), svg = $("hv");

  /* finish: intro over -> unlock scrolling, start snakes, raise the greeting, show profile + Enter button.
     instant === true skips the delays (used for edit mode / re-renders). */
  const finish = instant => {
    introDone = snakesOn = true;
    document.body.classList.remove("intro");
    cv.classList.add("on");
    bub.classList.add("dotin", "write", "done");

    if (instant === true) {
      stage.classList.add("moved");
      ok.classList.add("show");
    } else {
      tt = setTimeout(() => {
        stage.classList.add("moved");                                       /* greeting rises, profile box fades in */
        tt = setTimeout(() => ok.classList.add("show"), 1000);              /* then the Enter button */
      }, 1000);
    }
  };

  /* already seen the intro (or editing): show the final state with no animation */
  if (ED || introDone) {
    stage.classList.add("static");
    svg.classList.add("fill");
    finish(true);
    return;
  }

  /* hide every outline (dash trick) and park the dot at the first letter */
  const outlines = [...svg.querySelectorAll(".gp")];
  outlines.forEach(p => {
    p._len = p.getTotalLength();
    p.style.strokeDasharray = p._len;
    p.style.strokeDashoffset = p._len;
  });
  if (outlines[0]) dotAt(outlines[0], 0);

  /* timeline: 0.8s black, dot appears + pulses 1.5s, writing, 1.3s pause, finish */
  tt = setTimeout(() => {
    bub.classList.add("dotin");
    tt = setTimeout(() => {
      bub.classList.add("write");
      writeHello(() => { tt = setTimeout(finish, 1300); });
    }, 1500);
  }, 800);
}


/* =====================================================================
   6. EDITING + CLICKS + CONTACT FORM
   ===================================================================== */

/* Typing in an editable field. Which attribute is set tells us where the value goes:
   data-k = text in S, data-m = contact link, data-w = project link,
   data-ph = photo url, data-hl = greeting text */
document.addEventListener("input", e => {
  const t = e.target, d = t.dataset || {};

  if (d.k)       setP(d.k, d.k === "about" ? t.innerText.trim() : t.innerText.replace(/\n+/g, " ").trim());
  else if (d.m)  { S.m[d.m] = t.value.trim();  save(); }
  else if (d.w)  { S.ws[d.w].l = t.value.trim(); save(); }
  else if (d.ph) { S.photo = t.value.trim();   save(); }
  else if (d.pu) { S.ws[d.pu].img = t.value.trim(); save(); }
  else if (d.hl) { S.hello = t.value;          save(); }
});

/* Greeting field: redraw the handwriting once you leave the field */
document.addEventListener("change", e => {
  if (e.target.dataset && e.target.dataset.hl) render();
  const f = e.target.dataset && e.target.dataset.pi !== undefined && e.target.files[0];
  if (f) {                                   /* project picture upload: shrink to 900px and store */
    const i = +e.target.dataset.pi, fr = new FileReader();
    fr.onload = () => {
      const im = new Image();
      im.onload = () => {
        const k = Math.min(1, 900 / im.width), c = document.createElement("canvas");
        c.width = im.width * k; c.height = im.height * k;
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        S.ws[i].img = c.toDataURL("image/jpeg", .8); save(); render();
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(f);
  }
});

/* All clicks: nav / Enter button, add + delete cards and sub-cards, edit / reset / export buttons */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-go],[data-add],[data-add-sub],[data-del],[data-del-sub],button");
  if (!t) return;
  const d = t.dataset || {};

  /* go to a page */
  if (d.go) {
    if (introDone) $(d.go).scrollIntoView({ behavior: "smooth" });

  /* + add project / skill group / log / timeline card */
  } else if (d.add) {
    S[d.add].push(NEW_ITEM[d.add]());
    save(); render();

  /* + sub item (inside a timeline card) */
  } else if (d.addSub !== undefined) {
    S.tl[+d.addSub].subs.push(NEW_SUB());
    save(); render();

  /* ✕ delete a whole card (timeline card, project, skill group or log) */
  } else if (d.del) {
    const [key, i] = d.del.split(".");
    S[key].splice(+i, 1);
    save(); render();

  /* ✕ delete one sub item of a timeline card */
  } else if (d.delSub !== undefined) {
    const [i, j] = d.delSub.split(".");
    S.tl[+i].subs.splice(+j, 1);
    save(); render();

  /* remove project image */
  } else if (d.rmimg !== undefined) {
    S.ws[+d.rmimg].img = ""; save(); render();

  /* edit / done toggle */
  } else if (t.id === "ed") {
    ED = !ED;
    t.textContent = ED ? "✓ done" : "✎ edit";
    render();

  /* reset everything back to DEF */
  } else if (t.id === "rs" && confirm("Reset everything?")) {
    S = JSON.parse(JSON.stringify(DEF));
    save(); render();

  /* export edits as portfolio.json */
  } else if (t.id === "ex") {
    const a = document.createElement("a");
    a.href = "data:application/json;charset=utf-8," + encodeURIComponent(JSON.stringify(S, null, 2));
    a.download = "portfolio.json";
    a.click();
  }
});

/* Contact form: POSTs to the "form" URL if set, else opens the visitor's email app, else shows a notice */
document.addEventListener("submit", async e => {
  if (e.target.id !== "cf") return;
  e.preventDefault();

  const form = e.target, status = $("fs");
  const data = Object.fromEntries(new FormData(form));
  const endpoint = safe(S.m.form);

  if (endpoint) {
    status.textContent = "Sending...";
    try {
      const res = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json", Accept: "application/json" },
        body: JSON.stringify(data)
      });
      if (!res.ok) throw 0;
      status.textContent = "Thanks " + data.name + ", message sent!";
      form.reset();
    } catch (err) {
      status.textContent = "Sorry, something went wrong. Please try again.";
    }
  } else if (S.m.email) {
    location.href = "mailto:" + S.m.email.replace(/^mailto:/, "") +
      "?subject=" + encodeURIComponent("Message from " + data.name) +
      "&body=" + encodeURIComponent(data.message + "\n\nFrom: " + data.name + " (" + data.email + ")");
    status.textContent = "Opening your email app...";
  } else {
    status.textContent = "Not connected yet: the site owner needs to add an email or form endpoint.";
  }
});


/* =====================================================================
   7. PAGE-BY-PAGE SCROLLING (wheel / touch / keyboard) + NAV HIGHLIGHT
   ===================================================================== */
const IDS = ["home", "s1", "s2", "s3", "s4", "s5", "s6"];   /* page element ids, in nav order */

/* busy = animating to a page, lastW = time of last wheel event, ty = touch start y */
let busy = false, lastW = 0, ty = 0;

/* True if a scrollable panel (.sc) under the pointer can still scroll in direction d */
const inner = (t, d) => { const el = t.closest && t.closest(".sc");
  return !!el && (d > 0 ? el.scrollTop + el.clientHeight < el.scrollHeight - 2 : el.scrollTop > 0); };

/* Index of the page currently on screen */
const cur = () => {
  let page = 0;
  IDS.forEach((id, i) => { if ($(id).getBoundingClientRect().top < innerHeight * .5) page = i; });
  return page;
};

/* True when you've scrolled to the edge of a page in direction d (1 = down, -1 = up),
   meaning the next scroll should jump to the neighbouring page */
const canLock = d => {
  if (ED) return false;
  const r = $(IDS[cur()]).getBoundingClientRect();
  return d > 0 ? r.bottom <= innerHeight + 4 : r.top >= -4;
};

/* Smooth-scroll to page i */
function go(i) {
  i = Math.max(0, Math.min(IDS.length - 1, i));
  busy = true;
  $(IDS[i]).scrollIntoView({ behavior: "smooth" });
  /* stay "busy" until the scroll animation (and any trailing wheel events) settle */
  setTimeout(function settle() {
    Date.now() - lastW < 150 ? setTimeout(settle, 100) : busy = false;
  }, 700);
}

/* Mouse wheel */
addEventListener("wheel", e => {
  if (ED || e.ctrlKey) return;
  if (!introDone) { e.preventDefault(); return; }          /* no scrolling during the intro */

  lastW = Date.now();
  if (busy) { e.preventDefault(); return; }

  const d = Math.sign(e.deltaY);
  if (!d || Math.abs(e.deltaY) < 4) return;
  if (inner(e.target, d)) return;
  if (canLock(d)) { e.preventDefault(); go(cur() + d); }
}, { passive: false });

/* Touch swipe */
addEventListener("touchstart", e => { ty = e.touches[0].clientY; }, { passive: true });

addEventListener("touchmove", e => {
  if (ED) return;
  if (!introDone) { e.preventDefault(); return; }
  const d = Math.sign(ty - e.touches[0].clientY);
  if (busy || (d && canLock(d))) e.preventDefault();
}, { passive: false });

addEventListener("touchend", e => {
  if (!introDone) return;
  const dy = ty - e.changedTouches[0].clientY, d = Math.sign(dy);
  if (!busy && Math.abs(dy) > 50 && canLock(d)) go(cur() + d);
});

/* Keyboard: Enter (from Welcome), Home, End, arrows, Page Up/Down, Space */
addEventListener("keydown", e => {
  const a = document.activeElement;
  if (ED || !introDone || /INPUT|TEXTAREA/.test(a.tagName) || a.isContentEditable) return;

  const k = e.key;
  if (k === "Enter" && cur() === 0 && a.tagName !== "BUTTON") { e.preventDefault(); if (!busy) go(1); return; }
  if (k === "Home") { e.preventDefault(); go(0); return; }
  if (k === "End")  { e.preventDefault(); go(IDS.length - 1); return; }

  const d = k === " " ? (e.shiftKey ? -1 : 1) : { ArrowDown: 1, PageDown: 1, ArrowUp: -1, PageUp: -1 }[k];
  if (d && (busy || canLock(d))) { e.preventDefault(); if (!busy) go(cur() + d); }
});

/* Highlight the current page in the top bar; hide the bar on the Screen Saver page (index 6) */
function spy() {
  let on = -1;
  IDS.forEach((id, i) => { if ($(id).getBoundingClientRect().top < innerHeight * .45) on = i; });
  document.querySelectorAll("#nav a").forEach((a, i) => a.classList.toggle("on", i === on));
  document.body.classList.toggle("ss", on === 6);
}
addEventListener("scroll", spy, { passive: true });

/* Live clock in the status box */
setInterval(() => {
  $("clk").textContent = new Date().toLocaleTimeString([], { hour12: false });
}, 1000);


/* =====================================================================
   8. MOVING SNAKES BACKGROUND (starts when the intro finishes: snakesOn)
   ===================================================================== */
const cv = $("bg"), cx = cv.getContext("2d");

/* Each message becomes one snake; the first letter of each word is white */
const messages = [
  "Xuan Is AMAZING",
  "Xuan is very good at videogames",
  "Xuan is Great at Marvel Rivals",
  "Xuan gets shit done on time",
  "Xuan is quick at understanding code bases"
];

const FONT_SIZE    = 15;   /* letter size */
const SEGMENT_GAP  = 12;   /* spacing between letters */
const SPEED        = 1.5;  /* snake speed */
const MOUSE_RADIUS = 30;   /* how close the mouse can get before snakes bounce off */

/* Mouse position + click-and-drag selection box (snakes bounce off the box) */
const mouse = { x: -1000, y: -1000 };
let isDragging = false, dragStart = { x: 0, y: 0 }, dragEnd = { x: 0, y: 0 };

addEventListener("dragstart", e => e.preventDefault());

addEventListener("mousemove", e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  if (isDragging) { dragEnd.x = e.clientX; dragEnd.y = e.clientY; }
});

addEventListener("mousedown", e => {
  /* don't start a box on links / buttons / cards / the form / the profile box */
  if (e.target.tagName === "A" || e.target.tagName === "BUTTON" || e.target.closest(".card,form,#prof")) return;
  isDragging = true;
  dragStart = { x: e.clientX, y: e.clientY };
  dragEnd   = { x: e.clientX, y: e.clientY };
});

addEventListener("mouseup", () => { isDragging = false; });

document.addEventListener("mouseleave", () => {            /* pointer left the page */
  mouse.x = mouse.y = -1000;
  isDragging = false;
});

/* For each message, the positions of every word's first letter */
const wordStarts = messages.map(msg => {
  const starts = new Set();
  let atWordStart = true;
  for (let i = 0; i < msg.length; i++) {
    if (msg[i] === " ") atWordStart = true;
    else if (atWordStart) { starts.add(i); atWordStart = false; }
  }
  return starts;
});

/* One snake per message: start position, random direction, and a trail of past positions (path) */
const snakes = messages.map((text, i) => {
  const angle = Math.PI / 4 + i * Math.PI / 3 + Math.random() * .5;
  return { text, idx: i, x: 100 + i * 160, y: 100 + i * 120, dirX: Math.cos(angle), dirY: Math.sin(angle), path: [] };
});

function resizeCanvas() {
  cv.width = innerWidth;
  cv.height = innerHeight;
}

/* The current selection box, or null if the user isn't dragging one */
function selectionBox() {
  if (!isDragging) return null;
  const x = Math.min(dragStart.x, dragEnd.x), y = Math.min(dragStart.y, dragEnd.y);
  const w = Math.abs(dragEnd.x - dragStart.x), h = Math.abs(dragEnd.y - dragStart.y);
  if (w <= 2 && h <= 2) return null;
  return { minX: x, minY: y, maxX: x + w, maxY: y + h, width: w, height: h };
}

/* Move one snake one step: bounce off screen edges, the selection box and the mouse */
function moveSnake(s, box) {
  s.x += s.dirX * SPEED;
  s.y += s.dirY * SPEED;

  /* screen edges */
  if (s.x <= FONT_SIZE)                   { s.x = FONT_SIZE;                   s.dirX *= -1; }
  else if (s.x >= cv.width - FONT_SIZE)   { s.x = cv.width - FONT_SIZE;        s.dirX *= -1; }
  if (s.y <= FONT_SIZE)                   { s.y = FONT_SIZE;                   s.dirY *= -1; }
  else if (s.y >= cv.height - FONT_SIZE)  { s.y = cv.height - FONT_SIZE;       s.dirY *= -1; }

  /* selection box: push out through the nearest side */
  if (box && s.x >= box.minX && s.x <= box.maxX && s.y >= box.minY && s.y <= box.maxY) {
    const left = s.x - box.minX, right = box.maxX - s.x, top = s.y - box.minY, bottom = box.maxY - s.y;
    const nearest = Math.min(left, right, top, bottom);
    if (nearest === left)       { s.x = box.minX; s.dirX *= -1; }
    else if (nearest === right) { s.x = box.maxX; s.dirX *= -1; }
    else if (nearest === top)   { s.y = box.minY; s.dirY *= -1; }
    else                        { s.y = box.maxY; s.dirY *= -1; }
  }

  /* mouse cursor: reflect the direction off the cursor's circle */
  const dx = s.x - mouse.x, dy = s.y - mouse.y, dist = Math.hypot(dx, dy);
  if (dist < MOUSE_RADIUS && dist > 0) {
    const nx = dx / dist, ny = dy / dist;
    s.x = mouse.x + nx * MOUSE_RADIUS;
    s.y = mouse.y + ny * MOUSE_RADIUS;
    const dot = s.dirX * nx + s.dirY * ny;
    s.dirX -= 2 * dot * nx;
    s.dirY -= 2 * dot * ny;
  }
}

/* Draw one snake: each letter sits further back along the trail */
function drawSnake(s) {
  s.path.unshift({ x: s.x, y: s.y });                                      /* remember the head position */
  if (s.path.length > s.text.length * SEGMENT_GAP + 1) s.path.pop();       /* forget the oldest */

  const starts = wordStarts[s.idx];
  for (let i = 0; i < s.text.length; i++) {
    const pos = s.path[Math.floor(i * SEGMENT_GAP)] || s.path[s.path.length - 1];
    if (!pos) continue;

    if (starts.has(i)) { cx.fillStyle = "#fff";    cx.shadowColor = "#ff0033"; cx.shadowBlur = 8; }   /* first letter of a word: white glow */
    else               { cx.fillStyle = "#ff3333"; cx.shadowBlur = 0; }
    cx.fillText(s.text[i], pos.x, pos.y);
  }
  cx.shadowBlur = 0;
}

/* One animation frame: clear, move + draw every snake, draw the selection box */
function drawFrame() {
  cx.fillStyle = "#0a0a0a";
  cx.fillRect(0, 0, cv.width, cv.height);

  const box = selectionBox();

  cx.font = `bold ${FONT_SIZE}px monospace`;
  cx.textAlign = "center";
  cx.textBaseline = "middle";

  if (snakesOn) snakes.forEach(s => { moveSnake(s, box); drawSnake(s); });

  if (box) {
    cx.fillStyle = "rgba(255,51,51,.15)";
    cx.fillRect(box.minX, box.minY, box.width, box.height);
    cx.strokeStyle = "#ff4d4d";
    cx.lineWidth = 1.5;
    cx.setLineDash([4, 4]);
    cx.strokeRect(box.minX, box.minY, box.width, box.height);
    cx.setLineDash([]);
  }
  requestAnimationFrame(drawFrame);
}

addEventListener("resize", resizeCanvas);
resizeCanvas();
/* skip the snakes if the visitor prefers reduced motion */
if (!matchMedia("(prefers-reduced-motion: reduce)").matches) requestAnimationFrame(drawFrame);


/* =====================================================================
   9. START
   ===================================================================== */
render();
spy();
</script>
</body>
</html>
